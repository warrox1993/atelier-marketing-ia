schema: "paperclip/v1"
schemaVersion: 7
company:
  requireBoardApprovalForNewAgents: true
agents:
  coordinateur:
    role: "ceo"
    capabilities: "Transforme la demande en brief et en exigences REQ-xxx, construit le graphe de tâches sans cycle, affecte, arbitre, organise les relectures et prépare le dossier humain."
    adapter:
      type: "claude_local"
      config:
        engine: "cli"
        model: "claude-opus-5-5"
        effort: "high"
        dangerouslySkipPermissions: false
        maxTurnsPerRun: 60
        timeoutSec: 1800
        graceSec: 30
        extraArgs:
          - "--exclude-dynamic-system-prompt-sections"
          - "--permission-mode"
          - "dontAsk"
          - "--allowedTools"
          - "mcp__paperclip-assigned__atelier_marketing-ia_mission_etat"
          - "mcp__paperclip-assigned__atelier_marketing-ia_sources_lister"
          - "Bash(curl *)"
          - "mcp__Paperclip_projects__list_projects"
          - "mcp__Paperclip_projects__list_project_repositories"
          - "mcp__Paperclip_projects__create_project"
          - "mcp__Paperclip_projects__create_task"
          - "mcp__Paperclip_projects__set_task_title"
          - "--disallowedTools"
          - "WebFetch"
          - "WebSearch"
          - "Edit"
          - "NotebookEdit"
          - "Agent"
          - "Task"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_document"
          - "mcp__paperclip-assigned__atelier_marketing-ia_etat_fabrication"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_video"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_image"
          - "mcp__paperclip-assigned__atelier_marketing-ia_voir_rendu"
          - "Workflow"
          - "ScheduleWakeup"
          - "ReportFindings"
          - "ListAgents"
          - "EnterWorktree"
          - "ExitWorktree"
          - "SendMessage"
        env:
          DISABLE_TELEMETRY:
            type: "plain"
            value: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:
            type: "plain"
            value: "1"
          CLAUDE_CODE_PROMPT_CACHE_TTL:
            type: "plain"
            value: "1h"
          CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS:
            type: "plain"
            value: "1"
          CLAUDE_CODE_RETRY_WATCHDOG:
            type: "plain"
            value: "1"
          ENABLE_TOOL_SEARCH:
            type: "plain"
            value: "auto"
        filesystemScope: "workspace"
        networkScope: "allowlist"
        networkAllowlist:
          - "api.anthropic.com:443"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
        maxDailyRuns: 30
        sessionCompaction:
          enabled: true
          maxSessionRuns: 5
    budgetMonthlyCents: 3000
    metadata:
      atelier:
        registre: "atelier/registre-agents/v1"
        versionRegistre: "1.18.0"
        slug: "coordinateur"
        titre: "Coordinateur marketing"
        entrees:
          - "demande du client ou de l'opérateur"
          - "corpus de marque et sources de la campagne"
          - "verdicts des contrôleurs"
          - "réponses humaines aux questions ouvertes"
        sorties:
          - "brief structuré"
          - "liste d'exigences REQ-xxx avec critères"
          - "graphe de tâches avec dépendances"
          - "décisions d'arbitrage documentées"
          - "dossier de validation humaine"
        competencesObligatoires:
          - "cadrage-exigences"
          - "dossier-validation-humaine"
        outilsRecherche:
          - "Read"
          - "Grep"
          - "Glob"
          - "mcp__paperclip-assigned__atelier_marketing-ia_mission_etat"
          - "mcp__paperclip-assigned__atelier_marketing-ia_sources_lister"
        outilsMutation:
          - "Bash(curl *)"
        outilsInterdits:
          - "WebFetch"
          - "WebSearch"
          - "Write"
          - "Edit"
          - "NotebookEdit"
          - "Agent"
          - "Task"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_document"
          - "mcp__paperclip-assigned__atelier_marketing-ia_etat_fabrication"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_video"
          - "mcp__paperclip-assigned__atelier_marketing-ia_fabriquer_image"
          - "mcp__paperclip-assigned__atelier_marketing-ia_voir_rendu"
        relit: []
        roleRevue: null
        connexions: {}
        criteresReussite:
          - "chaque exigence du brief a un identifiant stable, son texte d'origine et son caractère obligatoire"
          - "le graphe de tâches est sans cycle et chaque tâche a un responsable et un livrable attendu"
          - "aucune hypothèse n'est présentée comme un fait"
          - "aucun dossier n'est déclaré prêt si un contrôle bloquant n'a pas réussi"
    inputs:
      env:
        CLAUDE_CODE_OAUTH_TOKEN:
          kind: "secret"
          requirement: "optional"
          description: "Jeton longue durée produit par « claude setup-token » (abonnement Claude de l'opérateur, usage personnel). Stocké comme secret Paperclip, jamais dans un fichier."
        CLAUDE_CONFIG_DIR:
          kind: "plain"
          requirement: "optional"
          portability: "system_dependent"
          description: "Dossier de configuration Claude dédié à l'agent, créé par le bootstrap sous instance/claude-config/<id entreprise>/<slug> (un dossier par entreprise et par rôle). Jamais le ~/.claude de l'opérateur."
